name: Release

on:
  push:
    tags:
      - 'kindasafe-*'

jobs:
  kindasafe-release:
    permissions:
      contents: write
    name: kindasafe
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: make check/tag-version
      - name: Verify kindasafe versions match
        run: make check/versions-match
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "${{ github.ref_name }}"
          name: "kindasafe ${{ github.ref_name }}"
          draft: true
          prerelease: false
